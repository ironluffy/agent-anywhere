[package]
name = "aany-pool"
version = "0.1.0"
edition = "2021"
authors = []
description = "Agent pool management library for Agent Anywhere system"
homepage = "https://agent-anywhere.com"
repository = "https://github.com/ironluffy/agent-anywhere"
license = "MIT"

[lib]
name = "aany_pool"

[dependencies]
# Local dependencies
aany-tmux = { path = "../aany-tmux" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# File system operations are included in tokio with "fs" feature

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
directories = "5.0"