[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-rust>=1.5.2"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"

[tool.cibuildwheel.linux]
before-all = "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
before-all = "rustup target add x86_64-apple-darwin aarch64-apple-darwin"

[tool.cibuildwheel.windows]
before-build = "rustup target add x86_64-pc-windows-msvc"

[project]
name = "tmux-agent"
version = "0.1.0"
description = "Agent-friendly tmux wrapper with safety controls"
readme = "README.md"
license = "MIT"
authors = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: System Shells",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://agent-anywhere.com"
Repository = "https://github.com/ironluffy/agent-anywhere"
Issues = "https://github.com/ironluffy/agent-anywhere/issues"
"Private Wheels" = "https://pypi.company.internal/tmux-agent/"

[project.scripts]
tmux-agent = "tmux_agent:main"
tma = "tmux_agent:main"
tmon = "tmux_agent:monitor"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["tmux_agent"]
include-package-data = true

[tool.setuptools.package-data]
tmux_agent = ["bin/*"]