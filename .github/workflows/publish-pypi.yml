name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead'
        required: false
        default: 'false'

jobs:
  build-and-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools-rust twine
    
    - name: Build wheel and sdist
      working-directory: python
      run: |
        python -m build
        ls -la dist/
    
    - name: Check distribution
      working-directory: python
      run: twine check dist/*
    
    - name: Publish to Test PyPI
      if: github.event.inputs.test_pypi == 'true'
      working-directory: python
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/*
        echo "📦 Published to Test PyPI!"
        echo "Install with: pip install --index-url https://test.pypi.org/simple/ tmux-agent"
    
    - name: Publish to PyPI
      if: github.event_name == 'release' && github.event.inputs.test_pypi != 'true'
      working-directory: python
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
        echo "📦 Published to PyPI!"
        echo "Install with: pip install tmux-agent"