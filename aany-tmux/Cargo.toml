[package]
name = "aany-tmux"
version = "0.1.0"
edition = "2021"
authors = []
description = "TMux interaction library for Agent Anywhere system"
homepage = "https://agent-anywhere.com"
repository = "https://github.com/ironluffy/agent-anywhere"
license = "MIT"

[lib]
name = "aany_tmux"
crate-type = ["cdylib", "rlib"]  # cdylib for Python FFI, rlib for Rust usage

[dependencies]
# For async operations
tokio = { version = "1.35", features = ["full"] }

# We'll add PyO3 later when you're ready for Python bindings
# pyo3 = { version = "0.20", features = ["extension-module"] }
